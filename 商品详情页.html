    window.addToCart = function(product) {
        const existingItem = window.APP_GLOBALS.cart.find(item => item.id === product.id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            window.APP_GLOBALS.cart.push({...product, quantity: 1});

    // 1. Configure page header
    if (window.configureHeader) {
        window.configureHeader({
            title: &#39;商品详情&#39;,
            showBackButton: true
        });
    }

    // 2. Initialize product image carousel
    const carousel = document.getElementById(&#39;productCarousel&#39;);
    const indicatorsContainer = document.getElementById(&#39;carouselIndicators&#39;);
    const slides = Array.from(carousel.querySelectorAll(&#39;.carousel-item&#39;));

    if (carousel &amp;&amp; indicatorsContainer &amp;&amp; slides.length > 0) {
        // Create indicator dots
        slides.forEach((slide, index) => {
            const dot = document.createElement(&#39;div&#39;);
            dot.classList.add(&#39;indicator&#39;);
            if (index === 0) {
                dot.classList.add(&#39;active&#39;);
            }
            indicatorsContainer.appendChild(dot);
        });

        const dots = Array.from(indicatorsContainer.querySelectorAll(&#39;.indicator&#39;));

        // Use Intersection Observer to update active dot on swipe
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const slideId = entry.target.id;
                    const index = slides.findIndex(s => s.id === slideId);

                    if (index !== -1) {
                        dots.forEach((dot, i) => {
                            dot.classList.toggle(&#39;active&#39;, i === index);
                        });
                    }
                }
            });
        }, {
            root: carousel,
            threshold: 0.5 // 50% of the item must be visible
        });

        slides.forEach(slide => observer.observe(slide));
    }
});

            cartIcon.addEventListener(&#39;animationend&#39;, () => {
                cartIcon.classList.remove(&#39;bouncing&#39;);
            }, { once: true });
