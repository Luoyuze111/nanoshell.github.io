<script>
(function() {
    // Header configuration function
    window.configureHeader = function(options = {}) {
        const header = document.querySelector(&#39;[data-section-id="common_header"]&#39;);
        if (!header) return;

        const {
            title = &#39;页面标题&#39;,
            showBackButton = true,
            showSearchButton = false,
            showSearchInput = false,
            showCartButton = false,
            showMoreMenu = false,
            onSearch = null,
            onCart = null
        } = options;

        // Update title
        const titleElement = header.querySelector(&#39;.header-title&#39;);
        titleElement.textContent = title;

        // Toggle back button
        const backBtn = header.querySelector(&#39;.header-back-btn&#39;);
        backBtn.style.display = showBackButton ? &#39;flex&#39; : &#39;none&#39;;

        // Toggle search elements
        const searchBtn = header.querySelector(&#39;.header-search-btn&#39;);
        const searchInput = header.querySelector(&#39;.header-search&#39;);
        searchBtn.classList.toggle(&#39;hidden&#39;, !showSearchButton);
        searchInput.classList.toggle(&#39;hidden&#39;, !showSearchInput);
        titleElement.classList.toggle(&#39;hidden&#39;, showSearchInput);

        // Toggle cart button
        const cartBtn = header.querySelector(&#39;.header-cart-btn&#39;);
        cartBtn.classList.toggle(&#39;hidden&#39;, !showCartButton);

        // Toggle more menu
        const moreMenu = header.querySelector(&#39;.header-more-menu&#39;);
        moreMenu.classList.toggle(&#39;hidden&#39;, !showMoreMenu);

        // Handle search toggle
        if (showSearchButton &amp;&amp; !showSearchInput) {
            searchBtn.onclick = function() {
                searchInput.classList.remove(&#39;hidden&#39;);
                titleElement.classList.add(&#39;hidden&#39;);
                searchBtn.classList.add(&#39;hidden&#39;);
                const input = searchInput.querySelector(&#39;input&#39;);
                input.focus();
            };
        }

        // Handle search input
        if (showSearchInput &amp;&amp; onSearch) {
            const input = searchInput.querySelector(&#39;input&#39;);
            input.addEventListener(&#39;input&#39;, function(e) {
                onSearch(e.target.value);
            });
        }

        // Update cart badge
        if (showCartButton) {
            updateCartBadge();
        }
    };

    function updateCartBadge() {
        const cartBadge = document.querySelector(&#39;[data-section-id="common_header"] .cart-badge&#39;);
        const count = window.getCartItemCount ? window.getCartItemCount() : 0;
        if (cartBadge) {
            if (count > 0) {
                cartBadge.textContent = count > 99 ? &#39;99+&#39; : count;
                cartBadge.classList.remove(&#39;hidden&#39;);
            } else {
                cartBadge.classList.add(&#39;hidden&#39;);
            }
        }
    }

    // Default header configuration
    document.addEventListener(&#39;DOMContentLoaded&#39;, function() {
        configureHeader();
    });

})();
</script>

<script>
/* JavaScript code for common usage, should be wrapped in a closure */
(function() {
    // Navigation function for page transitions
    window.navigateTo = function(targetPageId) {
        // Trigger navigation to another page using the provided snippet
        const isInIframe = window.self !== window.top;
        const targetFileName = `${targetPageId}.html`;
        if (isInIframe) {
            window.parent.postMessage({
                type: &#39;iframeNavigation&#39;,
                targetPageId: targetPageId
            }, &#39;*&#39;);
        } else {
            window.location.href = targetFileName;
        }
    };

    // Utility function to handle back navigation
    window.handleBackNavigation = function() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            navigateTo(&#39;home_page&#39;);
        }
    };

    // Function to show toast notifications
    window.showToast = function(message, type = &#39;info&#39;) {
        const toast = document.createElement(&#39;div&#39;);
        toast.className = `toast toast-bottom toast-center z-50`;
        toast.innerHTML = `<div class="alert alert-${type}"><span>${message}</span></div>`;
        document.body.appendChild(toast);
        
        // Auto remove after 3 seconds
        setTimeout(() => {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 3000);
    };

    // Smooth scroll to top function
    window.scrollToTop = function() {
        window.scrollTo({
            top: 0,
            behavior: &#39;smooth&#39;
        });
    };

    // Function to update bottom dock active state
    window.updateBottomDockActive = function(activeTabId) {
        const dockItems = document.querySelectorAll(&#39;[data-section-id="common_bottom_dock"] .dock-item&#39;);
        dockItems.forEach(item => {
            if (item.dataset.tabId === activeTabId) {
                item.classList.add(&#39;dock-item-active&#39;);
            } else {
                item.classList.remove(&#39;dock-item-active&#39;);
            }
        });
    };

    // Initialize global app state
    window.APP_GLOBALS = window.APP_GLOBALS || {};
    
    // Shopping cart management
    window.APP_GLOBALS.cart = window.APP_GLOBALS.cart || [];
    
    window.addToCart = function(product) {
        const existingItem = window.APP_GLOBALS.cart.find(item => item.id === product.id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            window.APP_GLOBALS.cart.push({...product, quantity: 1});
        }
        showToast(&#39;商品已添加到购物车&#39;, &#39;success&#39;);
        updateCartBadge();
    };

    window.removeFromCart = function(productId) {
        window.APP_GLOBALS.cart = window.APP_GLOBALS.cart.filter(item => item.id !== productId);
        updateCartBadge();
    };

    window.updateCartQuantity = function(productId, quantity) {
        const item = window.APP_GLOBALS.cart.find(item => item.id === productId);
        if (item) {
            if (quantity <= 0) {
                removeFromCart(productId);
            } else {
                item.quantity = quantity;
            }
        }
        updateCartBadge();
    };

    window.getCartTotal = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + (item.price * item.quantity), 0);
    };

    window.getCartItemCount = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + item.quantity, 0);
    };

    function updateCartBadge() {
        const cartBadge = document.querySelector(&#39;[data-section-id="common_bottom_dock"] .cart-badge&#39;);
        const count = getCartItemCount();
        if (cartBadge) {
            if (count > 0) {
                cartBadge.textContent = count > 99 ? &#39;99+&#39; : count;
                cartBadge.classList.remove(&#39;hidden&#39;);
            } else {
                cartBadge.classList.add(&#39;hidden&#39;);
            }
        }
    }

    // User session management
    window.APP_GLOBALS.user = window.APP_GLOBALS.user || null;
    window.APP_GLOBALS.isAdmin = window.APP_GLOBALS.isAdmin || false;

    window.setUser = function(user, isAdmin = false) {
        window.APP_GLOBALS.user = user;
        window.APP_GLOBALS.isAdmin = isAdmin;
    };

    window.logout = function() {
        window.APP_GLOBALS.user = null;
        window.APP_GLOBALS.isAdmin = false;
        window.APP_GLOBALS.cart = [];
        navigateTo(&#39;login_selection_page&#39;);
    };

    // Form validation utilities
    window.validateEmail = function(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    };

    window.validatePhone = function(phone) {
        const re = /^1[3-9]\d{9}$/;
        return re.test(phone);
    };

    window.validatePassword = function(password) {
        return password.length >= 6;
    };

})();
</script><script>

const messageItems = document.querySelectorAll(&#39;.message-item-wrapper&#39;);
    messageItems.forEach(item => {
        initializeSwipe(item);

    const forumEntry = document.querySelector(&#39;[onclick*="page_863244"]&#39;).closest(&#39;.message-item-wrapper&#39;);
    if (forumEntry) {

// Function to update system message based on user&#39;s order history
function updateSystemMessage() {
    const systemMessageElement = document.getElementById(&#39;itymx&#39;);
    if (!systemMessageElement) return;
    
    // Check if user has any orders (this would typically come from a backend API)
    // For demo purposes, we&#39;ll check if there are any items in cart history or simulate order check
    const hasOrders = window.APP_GLOBALS &amp;&amp; window.APP_GLOBALS.user &amp;&amp; window.APP_GLOBALS.user.hasOrders;
    
    if (hasOrders) {
        // Show order-related message only if user has actual orders
        systemMessageElement.textContent = &#39;您的订单 #897563 已成功下单。&#39;;
    } else {
        // Show welcome message for new users
        systemMessageElement.textContent = &#39;欢迎使用我们的购物平台！&#39;;
    }
}

// Function to handle message deletion
function deleteMessage(button) {
    const itemWrapper = button.closest(&#39;.message-item-wrapper&#39;);
    if (itemWrapper) {
        itemWrapper.classList.add(&#39;deleting&#39;);
        
        itemWrapper.addEventListener(&#39;animationend&#39;, () => {
            itemWrapper.remove();
            showToast(&#39;消息已删除&#39;, &#39;info&#39;);
        });
    }
}

// Minimal swipe-to-delete implementation
function initializeSwipe(item) {
    const slider = item.querySelector(&#39;.message-content-slider&#39;);
    const deleteAction = item.querySelector(&#39;.message-delete-action&#39;);
    if (!slider || !deleteAction) return;
    
    const deleteWidth = deleteAction.offsetWidth;

    let startX = 0;
    let currentX = 0;
    let isSwiping = false;
    let isOpen = false;

    const resetPosition = () => {
        slider.style.transition = &#39;transform 0.3s ease&#39;;
        slider.style.transform = &#39;translateX(0)&#39;;
        item.dataset.isOpen = &#39;false&#39;;
        isOpen = false;
    };
    
    const openPosition = () => {
        slider.style.transition = &#39;transform 0.3s ease&#39;;
        slider.style.transform = `translateX(-${deleteWidth}px)`;
        item.dataset.isOpen = &#39;true&#39;;
        isOpen = true;
    }
    
    const closeOthers = () => {
        document.querySelectorAll(&#39;.message-item-wrapper[data-is-open="true"]&#39;).forEach(otherItem => {
            if (otherItem !== item) {
                const otherSlider = otherItem.querySelector(&#39;.message-content-slider&#39;);
                if (otherSlider) {
                    otherSlider.style.transition = &#39;transform 0.3s ease&#39;;
                    otherSlider.style.transform = &#39;translateX(0)&#39;;
                    otherItem.dataset.isOpen = &#39;false&#39;;
                }
            }
        });
    };

    slider.addEventListener(&#39;touchstart&#39;, (e) => {
        if (e.touches.length > 1) return;
        closeOthers();
        
        startX = e.touches[0].clientX;
        isSwiping = true;
        slider.style.transition = &#39;none&#39;;
        isOpen = item.dataset.isOpen === &#39;true&#39;;
        currentX = startX; // Initialize currentX
    }, { passive: true });

    slider.addEventListener(&#39;touchmove&#39;, (e) => {
        if (!isSwiping || e.touches.length > 1) return;

        currentX = e.touches[0].clientX;
        let diffX = currentX - startX;
        
        if (isOpen) {
            diffX -= deleteWidth;
        }

        // Prevent swiping too far right, or too far left
        if (diffX > 5) diffX = 5;
        if (diffX < -deleteWidth - 32) diffX = -deleteWidth - 32;

        e.preventDefault(); // Prevent page scroll while swiping horizontally
        slider.style.transform = `translateX(${diffX}px)`;
    }, { passive: false });

    slider.addEventListener(&#39;touchend&#39;, () => {
        if (!isSwiping) return;
        isSwiping = false;
        
        const threshold = deleteWidth * 0.4;
        const diffX = currentX - startX;

        if (isOpen) {
            if (diffX > threshold) { // Swipe right to close
                resetPosition();
            } else { // Snap back to open
                openPosition();
            }
        } else {
            if (diffX < -threshold) { // Swipe left to open
                openPosition();
            } else { // Snap back to closed
                resetPosition();
            }
        }
    });

    document.body.addEventListener(&#39;click&#39;, (e) => {
        if (item.dataset.isOpen === &#39;true&#39; &amp;&amp; !item.contains(e.target)) {
            resetPosition();
        }
    }, true);
}
