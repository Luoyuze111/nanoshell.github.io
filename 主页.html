<script>
(function() {
    // Header configuration function
    window.configureHeader = function(options = {}) {
        const header = document.querySelector(&#39;[data-section-id="common_header"]&#39;);
        if (!header) return;

        const {
            title = &#39;页面标题&#39;,
            showBackButton = true,
            showSearchButton = false,
            showSearchInput = false,
            showCartButton = false,
            showMoreMenu = false,
            onSearch = null,
            onCart = null
        } = options;

        // Update title
        const titleElement = header.querySelector(&#39;.header-title&#39;);
        titleElement.textContent = title;

        // Toggle back button
        const backBtn = header.querySelector(&#39;.header-back-btn&#39;);
        backBtn.style.display = showBackButton ? &#39;flex&#39; : &#39;none&#39;;

        // Toggle search elements
        const searchBtn = header.querySelector(&#39;.header-search-btn&#39;);
        const searchInput = header.querySelector(&#39;.header-search&#39;);
        searchBtn.classList.toggle(&#39;hidden&#39;, !showSearchButton);
        searchInput.classList.toggle(&#39;hidden&#39;, !showSearchInput);
        titleElement.classList.toggle(&#39;hidden&#39;, showSearchInput);

        // Toggle cart button
        const cartBtn = header.querySelector(&#39;.header-cart-btn&#39;);
        cartBtn.classList.toggle(&#39;hidden&#39;, !showCartButton);

        // Toggle more menu
        const moreMenu = header.querySelector(&#39;.header-more-menu&#39;);
        moreMenu.classList.toggle(&#39;hidden&#39;, !showMoreMenu);

        // Handle search toggle
        if (showSearchButton &amp;&amp; !showSearchInput) {
            searchBtn.onclick = function() {
                searchInput.classList.remove(&#39;hidden&#39;);
                titleElement.classList.add(&#39;hidden&#39;);
                searchBtn.classList.add(&#39;hidden&#39;);
                const input = searchInput.querySelector(&#39;input&#39;);
                input.focus();
            };
        }

        // Handle search input
        if (showSearchInput &amp;&amp; onSearch) {
            const input = searchInput.querySelector(&#39;input&#39;);
            input.addEventListener(&#39;input&#39;, function(e) {
                onSearch(e.target.value);
            });
        }

        // Update cart badge
        if (showCartButton) {
            updateCartBadge();
        }
    };

    function updateCartBadge() {
        const cartBadge = document.querySelector(&#39;[data-section-id="common_header"] .cart-badge&#39;);
        const count = window.getCartItemCount ? window.getCartItemCount() : 0;
        if (cartBadge) {
            if (count > 0) {
                cartBadge.textContent = count > 99 ? &#39;99+&#39; : count;
                cartBadge.classList.remove(&#39;hidden&#39;);
            } else {
                cartBadge.classList.add(&#39;hidden&#39;);
            }
        }
    }

    // Default header configuration
    document.addEventListener(&#39;DOMContentLoaded&#39;, function() {
        configureHeader();
    });

})();
</script>

<script>
/* JavaScript code for common usage, should be wrapped in a closure */
(function() {
    // Navigation function for page transitions
    window.navigateTo = function(targetPageId) {
        // Trigger navigation to another page using the provided snippet
        const isInIframe = window.self !== window.top;
        const targetFileName = `${targetPageId}.html`;
        if (isInIframe) {
            window.parent.postMessage({
                type: &#39;iframeNavigation&#39;,
                targetPageId: targetPageId
            }, &#39;*&#39;);
        } else {
            window.location.href = targetFileName;
        }
    };

    // Utility function to handle back navigation
    window.handleBackNavigation = function() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            navigateTo(&#39;home_page&#39;);
        }
    };

    // Function to show toast notifications
    window.showToast = function(message, type = &#39;info&#39;) {
        const toast = document.createElement(&#39;div&#39;);
        toast.className = `toast toast-bottom toast-center z-50`;
        toast.innerHTML = `<div class="alert alert-${type}"><span>${message}</span></div>`;
        document.body.appendChild(toast);
        
        // Auto remove after 3 seconds
        setTimeout(() => {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 3000);
    };

    // Smooth scroll to top function
    window.scrollToTop = function() {
        window.scrollTo({
            top: 0,
            behavior: &#39;smooth&#39;
        });
    };

    // Function to update bottom dock active state
    window.updateBottomDockActive = function(activeTabId) {
        const dockItems = document.querySelectorAll(&#39;[data-section-id="common_bottom_dock"] .dock-item&#39;);
        dockItems.forEach(item => {
            if (item.dataset.tabId === activeTabId) {
                item.classList.add(&#39;dock-item-active&#39;);
            } else {
                item.classList.remove(&#39;dock-item-active&#39;);
            }
        });
    };

    // Initialize global app state
    window.APP_GLOBALS = window.APP_GLOBALS || {};
    
    // Shopping cart management
    window.APP_GLOBALS.cart = window.APP_GLOBALS.cart || [];
    
    window.addToCart = function(product) {
        const existingItem = window.APP_GLOBALS.cart.find(item => item.id === product.id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            window.APP_GLOBALS.cart.push({...product, quantity: 1});
        }
        showToast(&#39;商品已添加到购物车&#39;, &#39;success&#39;);
        updateCartBadge();
    };

    window.removeFromCart = function(productId) {
        window.APP_GLOBALS.cart = window.APP_GLOBALS.cart.filter(item => item.id !== productId);
        updateCartBadge();
    };

    window.updateCartQuantity = function(productId, quantity) {
        const item = window.APP_GLOBALS.cart.find(item => item.id === productId);
        if (item) {
            if (quantity <= 0) {
                removeFromCart(productId);
            } else {
                item.quantity = quantity;
            }
        }
        updateCartBadge();
    };

    window.getCartTotal = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + (item.price * item.quantity), 0);
    };

    window.getCartItemCount = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + item.quantity, 0);
    };

    function updateCartBadge() {
        const cartBadge = document.querySelector(&#39;[data-section-id="common_bottom_dock"] .cart-badge&#39;);
        const count = getCartItemCount();
        if (cartBadge) {
            if (count > 0) {
                cartBadge.textContent = count > 99 ? &#39;99+&#39; : count;
                cartBadge.classList.remove(&#39;hidden&#39;);
            } else {
                cartBadge.classList.add(&#39;hidden&#39;);
            }
        }
    }

    // User session management
    window.APP_GLOBALS.user = window.APP_GLOBALS.user || null;
    window.APP_GLOBALS.isAdmin = window.APP_GLOBALS.isAdmin || false;

    window.setUser = function(user, isAdmin = false) {
        window.APP_GLOBALS.user = user;
        window.APP_GLOBALS.isAdmin = isAdmin;
    };

    window.logout = function() {
        window.APP_GLOBALS.user = null;
        window.APP_GLOBALS.isAdmin = false;
        window.APP_GLOBALS.cart = [];
        navigateTo(&#39;login_selection_page&#39;);
    };

    // Form validation utilities
    window.validateEmail = function(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    };

    window.validatePhone = function(phone) {
        const re = /^1[3-9]\d{9}$/;
        return re.test(phone);
    };

    window.validatePassword = function(password) {
        return password.length >= 6;
    };

})();

// 商品数据管理
function getGlobalProducts() {
    if (!window.APP_GLOBALS) window.APP_GLOBALS = {};
    if (!window.APP_GLOBALS.products) {
        window.APP_GLOBALS.products = [
            { 
                id: 1, 
                name: &#39;请单击此选项卡后点击下单按钮下单&#39;, 
                price: 0, 
                originalPrice: null, 
                image: &#39;https://placehold.co/360x200.png?text=Demo+Product&#39;, 
                badge: &#39;演示&#39;, 
                category: &#39;demo&#39;, 
                stock: 1, 
                description: &#39;该软件未完善，无法完成在线查看商品操作&#39; 
            }
        ];

    return window.APP_GLOBALS.products;
}

// 获取当前商品列表
let currentProducts = [];
let currentFilter = &#39;all&#39;;
let currentSort = &#39;default&#39;;
let currentPage = 0;
const itemsPerPage = 1;
let isLoading = false;
let hasMoreItems = false;

// 初始化商品网格
function initProductGrid() {
    window.addEventListener(&#39;productsUpdated&#39;, handleProductsUpdate);
    refreshProductList();
    loadMoreProducts();
}

// 处理商品数据更新事件
function handleProductsUpdate(event) {
    const { action, product, productId } = event.detail;
    
    switch(action) {
        case &#39;add&#39;:
            currentProducts.unshift(product);
            refreshProductDisplay();
            showToast(&#39;新商品已添加到主页&#39;, &#39;success&#39;);
            break;
        case &#39;update&#39;:
            const index = currentProducts.findIndex(p => p.id === productId);
            if (index !== -1) {
                currentProducts[index] = { ...currentProducts[index], ...product };
                refreshProductDisplay();
                showToast(&#39;商品信息已更新&#39;, &#39;success&#39;);
            }
            break;
        case &#39;delete&#39;:
            currentProducts = currentProducts.filter(p => p.id !== productId);
            refreshProductDisplay();
            showToast(&#39;商品已从主页移除&#39;, &#39;info&#39;);
            break;
        case &#39;refresh&#39;:
            refreshProductList();
            refreshProductDisplay();
            break;
    }
}

// 刷新商品列表数据
function refreshProductList() {
    const allProducts = getGlobalProducts();
    
    let filteredProducts = allProducts;
    if (currentFilter !== &#39;all&#39;) {
        filteredProducts = allProducts.filter(product => product.category === currentFilter);
    }
    
    switch(currentSort) {
        case &#39;price-asc&#39;:
            filteredProducts.sort((a, b) => a.price - b.price);
            break;
        case &#39;price-desc&#39;:
            filteredProducts.sort((a, b) => b.price - a.price);
            break;
        case &#39;name&#39;:
            filteredProducts.sort((a, b) => a.name.localeCompare(b.name));
            break;
        case &#39;newest&#39;:
            filteredProducts.sort((a, b) => b.id - a.id);
            break;
        default:
            break;
    }
    
    currentProducts = filteredProducts;
}

// 刷新商品显示
function refreshProductDisplay() {
    const productGrid = document.getElementById(&#39;productGrid&#39;);
    productGrid.innerHTML = &#39;&#39;;
    
    currentPage = 0;
    hasMoreItems = true;
    
    loadMoreProducts();
}

// 加载更多商品
function loadMoreProducts() {
    if (isLoading || !hasMoreItems) return;
    
    isLoading = true;
    const loadIndicator = document.getElementById(&#39;loadMoreIndicator&#39;);
    loadIndicator.classList.remove(&#39;hidden&#39;);
    
    setTimeout(() => {
        const startIndex = currentPage * itemsPerPage;
        const endIndex = Math.min(startIndex + itemsPerPage, currentProducts.length);
        const productsToLoad = currentProducts.slice(startIndex, endIndex);
        
        if (productsToLoad.length === 0) {
            hasMoreItems = false;
            loadIndicator.classList.add(&#39;hidden&#39;);
            document.getElementById(&#39;loadCompleteMessage&#39;).classList.remove(&#39;hidden&#39;);
            return;
        }
        
        renderProducts(productsToLoad);
        currentPage++;
        
        if (endIndex >= currentProducts.length) {
            hasMoreItems = false;
            document.getElementById(&#39;loadCompleteMessage&#39;).classList.remove(&#39;hidden&#39;);
        }
        
        loadIndicator.classList.add(&#39;hidden&#39;);
        isLoading = false;
    }, 800);
}

// 渲染商品
function renderProducts(products) {
    const productGrid = document.getElementById(&#39;productGrid&#39;);
    
    products.forEach(product => {
        const productCard = createProductCard(product);
        productGrid.appendChild(productCard);
    });
}

// 创建商品卡片
function createProductCard(product) {

        <div class="product-image-container relative">

                    ${product.price > 0 ? `<span class="product-price ${isAdmin ? &#39;editable-text&#39; : &#39;&#39;}" ${isAdmin ? &#39;contenteditable="true"&#39; : &#39;&#39;} data-product-id="${product.id}" data-field="price">¥${product.price}</span>` : &#39;&#39;}
                    ${product.originalPrice ? `<span class="product-original-price ${isAdmin ? &#39;editable-text&#39; : &#39;&#39;}" ${isAdmin ? &#39;contenteditable="true"&#39; : &#39;&#39;} data-product-id="${product.id}" data-field="originalPrice">¥${product.originalPrice}</span>` : &#39;&#39;}
                </div>
                <div class="flex items-center gap-2 text-sm text-base-content/60">

    `;
    
    if (isAdmin) {
        setTimeout(() => {

        }, 0);

// 从主页添加到购物车
function addToCartFromHome(productId) {
    const product = getGlobalProducts().find(p => p.id === productId);
    if (product) {
        addToCart(product);
    }
}

// 初始化无限滚动
function initInfiniteScroll() {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting &amp;&amp; hasMoreItems &amp;&amp; !isLoading) {
                loadMoreProducts();
            }
        });
    }, {
        rootMargin: &#39;100px&#39;
    });
    
    const loadIndicator = document.getElementById(&#39;loadMoreIndicator&#39;);
    observer.observe(loadIndicator);
}

// 排序功能
let sortMenuVisible = false;

function toggleSortMenu() {
    const sortMenu = document.getElementById(&#39;sortMenu&#39;);
    if (!sortMenu) {
        createSortMenu();
    } else {
        sortMenuVisible = !sortMenuVisible;
        sortMenu.classList.toggle(&#39;active&#39;, sortMenuVisible);
    }
}

function createSortMenu() {
    const sortButton = document.querySelector(&#39;[onclick="toggleSortMenu()"]&#39;);
    const container = sortButton.parentElement;
    container.style.position = &#39;relative&#39;;
    
    const menu = document.createElement(&#39;div&#39;);
    menu.id = &#39;sortMenu&#39;;
    menu.className = &#39;sort-menu active&#39;;
    menu.innerHTML = `
        <button onclick="sortProducts(&#39;default&#39;)" class="active">默认排序</button>
        <button onclick="sortProducts(&#39;price-asc&#39;)">价格从低到高</button>
        <button onclick="sortProducts(&#39;price-desc&#39;)">价格从高到低</button>
        <button onclick="sortProducts(&#39;name&#39;)">按名称排序</button>
    `;
    
    container.appendChild(menu);
    sortMenuVisible = true;
    
    document.addEventListener(&#39;click&#39;, (e) => {
        if (!container.contains(e.target)) {
            menu.classList.remove(&#39;active&#39;);
            sortMenuVisible = false;
        }
    });
}

function sortProducts(type) {
    const menu = document.getElementById(&#39;sortMenu&#39;);
    menu.querySelectorAll(&#39;button&#39;).forEach(btn => btn.classList.remove(&#39;active&#39;));
    event.target.classList.add(&#39;active&#39;);
    
    currentSort = type;
    refreshProductList();
    refreshProductDisplay();
    
    menu.classList.remove(&#39;active&#39;);
    sortMenuVisible = false;
}

// 添加可编辑元素的事件监听器
function addEditableListeners(card, productId) {
    const editableTexts = card.querySelectorAll(&#39;.editable-text&#39;);
    editableTexts.forEach(element => {
        element.addEventListener(&#39;click&#39;, (e) => {
            e.stopPropagation();
            element.focus();
        });
        
        element.addEventListener(&#39;blur&#39;, (e) => {
            const field = e.target.dataset.field;
            const newValue = e.target.textContent.trim();
            updateProductData(productId, field, newValue);
        });
        
        element.addEventListener(&#39;keydown&#39;, (e) => {
            if (e.key === &#39;Enter&#39;) {
                e.preventDefault();
                e.target.blur();
            }
        });
    });
    
    const editOverlay = card.querySelector(&#39;.image-edit-overlay&#39;);
    if (editOverlay) {
        editOverlay.addEventListener(&#39;click&#39;, (e) => {
            e.stopPropagation();
            const imageElement = card.querySelector(&#39;.editable-image&#39;);
            showImageEditDialog(productId, imageElement);
        });
    }
}

// 更新商品数据
function updateProductData(productId, field, newValue) {
    const globalProducts = getGlobalProducts();
    const product = globalProducts.find(p => p.id === productId);
    if (!product) return;
    
    switch(field) {
        case &#39;name&#39;:
            product.name = newValue;
            break;
        case &#39;price&#39;:
            const priceMatch = newValue.match(/\d+/);
            if (priceMatch) {
                product.price = parseInt(priceMatch[0]);
            }
            break;
        case &#39;originalPrice&#39;:
            const originalPriceMatch = newValue.match(/\d+/);
            if (originalPriceMatch) {
                product.originalPrice = parseInt(originalPriceMatch[0]);
            }
            break;
        case &#39;badge&#39;:
            product.badge = newValue;
            break;
    }
    
    window.dispatchEvent(new CustomEvent(&#39;productsUpdated&#39;, {
        detail: {
            action: &#39;update&#39;,
            productId: productId,
            product: { [field]: field === &#39;price&#39; || field === &#39;originalPrice&#39; ? parseInt(newValue.match(/\d+/)?.[0] || 0) : newValue }
        }
    }));
    
    showToast(&#39;商品信息已更新&#39;, &#39;success&#39;);
}

// 显示图片编辑对话框
function showImageEditDialog(productId, imageElement) {
    const product = getGlobalProducts().find(p => p.id === productId);
    if (!product) return;
    
    const modal = document.createElement(&#39;div&#39;);
    modal.className = &#39;modal modal-open&#39;;
    modal.innerHTML = `
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">编辑商品图片</h3>
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">图片URL</span>
                </label>
                <input type="text" class="input input-bordered w-full" id="imageUrlInput" value="${product.image}" placeholder="请输入图片URL">
            </div>
            <div class="form-control mb-4">
                <label class="label">
                    <span class="label-text">图片描述</span>
                </label>
                <input type="text" class="input input-bordered w-full" id="imageDescInput" value="${imageElement.alt}" placeholder="请输入图片描述">
            </div>
            <div class="mb-4">
                <label class="label">
                    <span class="label-text">预览</span>
                </label>
                <div class="border rounded-lg p-2 bg-base-200">
                    <img id="imagePreview" src="${product.image}" alt="预览" class="w-full h-32 object-cover rounded">
                </div>
            </div>
            <div class="modal-action">
                <button class="btn btn-ghost" onclick="closeImageEditDialog()">取消</button>
                <button class="btn btn-primary" onclick="saveImageChanges(${productId})">保存</button>
            </div>
        </div>
        <div class="modal-backdrop" onclick="closeImageEditDialog()"></div>
    `;
    
    document.body.appendChild(modal);
    
    const urlInput = modal.querySelector(&#39;#imageUrlInput&#39;);
    const preview = modal.querySelector(&#39;#imagePreview&#39;);
    urlInput.addEventListener(&#39;input&#39;, (e) => {
        if (e.target.value.trim()) {
            preview.src = e.target.value.trim();
        }
    });
}

// 关闭图片编辑对话框
function closeImageEditDialog() {
    const modal = document.querySelector(&#39;.modal-open&#39;);
    if (modal) {
        modal.remove();
    }
}

// 保存图片更改
function saveImageChanges(productId) {
    const modal = document.querySelector(&#39;.modal-open&#39;);
    const urlInput = modal.querySelector(&#39;#imageUrlInput&#39;);
    const descInput = modal.querySelector(&#39;#imageDescInput&#39;);
    
    const newUrl = urlInput.value.trim();
    const newDesc = descInput.value.trim();
    
    if (!newUrl) {
        showToast(&#39;请输入有效的图片URL&#39;, &#39;error&#39;);
        return;
    }
    
    const globalProducts = getGlobalProducts();
    const product = globalProducts.find(p => p.id === productId);
    if (product) {
        product.image = newUrl;
        
        window.dispatchEvent(new CustomEvent(&#39;productsUpdated&#39;, {
            detail: {
                action: &#39;update&#39;,
                productId: productId,
                product: { image: newUrl }
            }
        }));
    }
    
    const imageElement = document.querySelector(`[data-product-id="${productId}"][data-field="image"]`);
    if (imageElement) {
        imageElement.src = newUrl;
        imageElement.alt = newDesc;
    }
    
    closeImageEditDialog();
    showToast(&#39;图片已更新&#39;, &#39;success&#39;);
}
</script>
