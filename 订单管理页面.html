        const dockItems = document.querySelectorAll(&#39;[data-section-id="common_bottom_dock"] .dock-item&#39;);
        dockItems.forEach(item => {
            if (item.dataset.tabId === activeTabId) {
                item.classList.add(&#39;dock-item-active&#39;);
            } else {
                item.classList.remove(&#39;dock-item-active&#39;);
            }
        });
    };

    // Initialize global app state
    window.APP_GLOBALS = window.APP_GLOBALS || {};
    
    // Shopping cart management
    window.APP_GLOBALS.cart = window.APP_GLOBALS.cart || [];
    
    window.addToCart = function(product) {
        const existingItem = window.APP_GLOBALS.cart.find(item => item.id === product.id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            window.APP_GLOBALS.cart.push({...product, quantity: 1});
        }
        showToast(&#39;商品已添加到购物车&#39;, &#39;success&#39;);

    window.removeFromCart = function(productId) {
        window.APP_GLOBALS.cart = window.APP_GLOBALS.cart.filter(item => item.id !== productId);
        updateCartBadge();
    };

    window.updateCartQuantity = function(productId, quantity) {
        const item = window.APP_GLOBALS.cart.find(item => item.id === productId);
        if (item) {

        const filteredOrders = mockOrders.filter(order => currentFilter === &#39;all&#39; || order.status === currentFilter);

        if (filteredOrders.length > 0) {
            filteredOrders.forEach(order => {
                orderListContainer.appendChild(createOrderCard(order));
            });
            emptyState.classList.add(&#39;hidden&#39;);
        } else {
            emptyState.classList.remove(&#39;hidden&#39;);
        }
        addCardEventListeners();
        updateSelectedState();
    }
    
    function addCardEventListeners() {
        document.querySelectorAll(&#39;.order-checkbox&#39;).forEach(cb => {
            cb.addEventListener(&#39;change&#39;, updateSelectedState);
        });
    }

    function updateSelectedState() {
        const visibleCheckboxes = Array.from(document.querySelectorAll(&#39;.order-checkbox&#39;));
        const checkedCount = visibleCheckboxes.filter(cb => cb.checked).length;
        
        selectedCountSpan.textContent = checkedCount;

        if (checkedCount > 0) {
            batchActionFooter.classList.remove(&#39;hidden&#39;);
            batchShipButton.disabled = false;
        } else {
            batchActionFooter.classList.add(&#39;hidden&#39;);
            batchShipButton.disabled = true;
        }

        const allVisibleChecked = visibleCheckboxes.length > 0 &amp;&amp; checkedCount === visibleCheckboxes.length;
        selectAllCheckbox.checked = allVisibleChecked;
        selectAllCheckbox.indeterminate = checkedCount > 0 &amp;&amp; !allVisibleChecked;
    }

    filterTabs.forEach(tab => {
        tab.addEventListener(&#39;click&#39;, () => {
            currentFilter = tab.dataset.status;
            filterTabs.forEach(t => {
                t.classList.remove(&#39;btn-primary&#39;, &#39;active-filter&#39;);
                t.classList.add(&#39;btn-ghost&#39;);
            });
            tab.classList.add(&#39;btn-primary&#39;, &#39;active-filter&#39;);
            tab.classList.remove(&#39;btn-ghost&#39;);
            renderOrders();
        });
    });

    selectAllCheckbox.addEventListener(&#39;change&#39;, (e) => {
        const isChecked = e.target.checked;
        document.querySelectorAll(&#39;.order-checkbox&#39;).forEach(cb => {
            const card = cb.closest(&#39;.order-card&#39;);
            if (card.style.display !== &#39;none&#39;) {
                 cb.checked = isChecked;
            }
        });
        updateSelectedState();
    });

    window.toggleOrderDetails = (button) => {
        const details = button.closest(&#39;.card-body&#39;).querySelector(&#39;.order-card-details&#39;);
        const icon = button.querySelector(&#39;.iconify&#39;);
        details.classList.toggle(&#39;expanded&#39;);
        if (details.classList.contains(&#39;expanded&#39;)) {
            icon.setAttribute(&#39;data-icon&#39;, &#39;heroicons:chevron-up&#39;);
        } else {
            icon.setAttribute(&#39;data-icon&#39;, &#39;heroicons:chevron-down&#39;);
        }
    };

    window.shipOrder = (orderId, event) => {
        event.stopPropagation();
        const button = event.currentTarget;
        const card = button.closest(&#39;.order-card&#39;);
        
        button.innerHTML = &#39;<span class="loading loading-spinner loading-xs"></span>&#39;;
        button.disabled = true;

        setTimeout(() => {
            const orderIndex = mockOrders.findIndex(o => o.id === orderId);
            if (orderIndex > -1) {
                mockOrders[orderIndex].status = &#39;completed&#39;;
            }
            renderOrders(); // Re-render to reflect the change
            showToast(`订单 ${orderId} 已发货`, &#39;success&#39;);
        }, 1000);
    };

    window.showBatchShipModal = () => {
        batch_ship_modal.showModal();
    };

    window.handleConfirmBatchShip = () => {
        const selectedCheckboxes = document.querySelectorAll(&#39;.order-checkbox:checked&#39;);
        let shippedCount = 0;
        selectedCheckboxes.forEach(cb => {
            const orderId = cb.dataset.orderId;
            const orderIndex = mockOrders.findIndex(o => o.id === orderId &amp;&amp; o.status === &#39;pending&#39;);
            if(orderIndex > -1) {
                mockOrders[orderIndex].status = &#39;completed&#39;;
                shippedCount++;
            }
        });
        
        if (shippedCount > 0) {
            showToast(`成功发货 ${shippedCount} 个订单`, &#39;success&#39;);
        } else {
            showToast(&#39;没有可发货的订单被选中&#39;, &#39;info&#39;);
        }
        renderOrders();
    };

    // Initial render
    renderOrders();
});
</script>

      Holder.run({
        domain: "placehold.co"
      })
    }, 100)
