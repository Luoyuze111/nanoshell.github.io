                function setIframeSize(w, h) {

                  let widthValue = w

                  let zoom = 1
                  if (currentContainerRadio > resolutionRatio) {
                    widthValue = h * resolutionRatio
                    heightValue = h
                  } else {

(function() {
    // Navigation function for page transitions
    window.navigateTo = function(targetPageId) {
        // Trigger navigation to another page using the provided snippet
        const isInIframe = window.self !== window.top;
        const targetFileName = `${targetPageId}.html`;
        if (isInIframe) {
            window.parent.postMessage({
                type: &#39;iframeNavigation&#39;,
                targetPageId: targetPageId
            }, &#39;*&#39;);
        } else {
            window.location.href = targetFileName;
        }
    };

    // Utility function to handle back navigation
    window.handleBackNavigation = function() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            navigateTo(&#39;home_page&#39;);
        }
    };

    // Function to show toast notifications
    window.showToast = function(message, type = &#39;info&#39;) {
        const toast = document.createElement(&#39;div&#39;);
        toast.className = `toast toast-bottom toast-center z-50`;
        toast.innerHTML = `<div class="alert alert-${type}"><span>${message}</span></div>`;
        document.body.appendChild(toast);
        
        // Auto remove after 3 seconds
        setTimeout(() => {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 3000);
    };

    // Smooth scroll to top function
    window.scrollToTop = function() {
        window.scrollTo({
            top: 0,
            behavior: &#39;smooth&#39;
        });
    };

    // Function to update bottom dock active state
    window.updateBottomDockActive = function(activeTabId) {
        const dockItems = document.querySelectorAll(&#39;[data-section-id="common_bottom_dock"] .dock-item&#39;);
        dockItems.forEach(item => {
            if (item.dataset.tabId === activeTabId) {
                item.classList.add(&#39;dock-item-active&#39;);
            } else {
                item.classList.remove(&#39;dock-item-active&#39;);
            }
        });
    };

    // Initialize global app state
    window.APP_GLOBALS = window.APP_GLOBALS || {};
    
    // Shopping cart management
    window.APP_GLOBALS.cart = window.APP_GLOBALS.cart || [];
    
    window.addToCart = function(product) {
        const existingItem = window.APP_GLOBALS.cart.find(item => item.id === product.id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            window.APP_GLOBALS.cart.push({...product, quantity: 1});
        }
        showToast(&#39;商品已添加到购物车&#39;, &#39;success&#39;);
        updateCartBadge();
    };

    window.removeFromCart = function(productId) {
        window.APP_GLOBALS.cart = window.APP_GLOBALS.cart.filter(item => item.id !== productId);
        updateCartBadge();
    };

    window.updateCartQuantity = function(productId, quantity) {
        const item = window.APP_GLOBALS.cart.find(item => item.id === productId);
        if (item) {
            if (quantity <= 0) {
                removeFromCart(productId);
            } else {
                item.quantity = quantity;
            }
        }
        updateCartBadge();
    };

    window.getCartTotal = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + (item.price * item.quantity), 0);
    };

    window.getCartItemCount = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + item.quantity, 0);
    };

    function updateCartBadge() {
        const cartBadge = document.querySelector(&#39;[data-section-id="common_bottom_dock"] .cart-badge&#39;);
        const count = getCartItemCount();
        if (cartBadge) {
            if (count > 0) {
                cartBadge.textContent = count > 99 ? &#39;99+&#39; : count;
                cartBadge.classList.remove(&#39;hidden&#39;);
            } else {
                cartBadge.classList.add(&#39;hidden&#39;);
            }
        }
    }

    // User session management
    window.APP_GLOBALS.user = window.APP_GLOBALS.user || null;
    window.APP_GLOBALS.isAdmin = window.APP_GLOBALS.isAdmin || false;

    window.setUser = function(user, isAdmin = false) {
        window.APP_GLOBALS.user = user;
        window.APP_GLOBALS.isAdmin = isAdmin;
    };

    window.logout = function() {
        window.APP_GLOBALS.user = null;
        window.APP_GLOBALS.isAdmin = false;
        window.APP_GLOBALS.cart = [];
        navigateTo(&#39;login_selection_page&#39;);
    };

    // Form validation utilities
    window.validateEmail = function(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    };

    window.validatePhone = function(phone) {
        const re = /^1[3-9]\d{9}$/;
        return re.test(phone);
    };

    window.validatePassword = function(password) {
        return password.length >= 6;
    };

})();
