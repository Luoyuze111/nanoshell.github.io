(function() {
    // Header configuration function
    window.configureHeader = function(options = {}) {
        const header = document.querySelector(&#39;[data-section-id="common_header"]&#39;);
        if (!header) return;

        const {
            title = &#39;页面标题&#39;,
            showBackButton = true,
            showSearchButton = false,
            showSearchInput = false,
            showCartButton = false,
            showMoreMenu = false,
            onSearch = null,
            onCart = null
        } = options;

        // Update title
        const titleElement = header.querySelector(&#39;.header-title&#39;);
        titleElement.textContent = title;

        // Toggle back button
        const backBtn = header.querySelector(&#39;.header-back-btn&#39;);
        backBtn.style.display = showBackButton ? &#39;flex&#39; : &#39;none&#39;;

        // Toggle search elements
        const searchBtn = header.querySelector(&#39;.header-search-btn&#39;);
        const searchInput = header.querySelector(&#39;.header-search&#39;);
        searchBtn.classList.toggle(&#39;hidden&#39;, !showSearchButton);
        searchInput.classList.toggle(&#39;hidden&#39;, !showSearchInput);
        titleElement.classList.toggle(&#39;hidden&#39;, showSearchInput);

        // Toggle cart button
        const cartBtn = header.querySelector(&#39;.header-cart-btn&#39;);
        cartBtn.classList.toggle(&#39;hidden&#39;, !showCartButton);

        // Toggle more menu
        const moreMenu = header.querySelector(&#39;.header-more-menu&#39;);
        moreMenu.classList.toggle(&#39;hidden&#39;, !showMoreMenu);

        // Handle search toggle
        if (showSearchButton &amp;&amp; !showSearchInput) {
            searchBtn.onclick = function() {
                searchInput.classList.remove(&#39;hidden&#39;);
                titleElement.classList.add(&#39;hidden&#39;);
                searchBtn.classList.add(&#39;hidden&#39;);
                const input = searchInput.querySelector(&#39;input&#39;);
                input.focus();
            };
        }

        // Handle search input
        if (showSearchInput &amp;&amp; onSearch) {
            const input = searchInput.querySelector(&#39;input&#39;);
            input.addEventListener(&#39;input&#39;, function(e) {
                onSearch(e.target.value);
            });
        }

        // Update cart badge
        if (showCartButton) {
            updateCartBadge();
        }
    };

    function updateCartBadge() {
        const cartBadge = document.querySelector(&#39;[data-section-id="common_header"] .cart-badge&#39;);
        const count = window.getCartItemCount ? window.getCartItemCount() : 0;
        if (cartBadge) {
            if (count > 0) {
                cartBadge.textContent = count > 99 ? &#39;99+&#39; : count;
                cartBadge.classList.remove(&#39;hidden&#39;);
            } else {
                cartBadge.classList.add(&#39;hidden&#39;);
            }
        }
    }

    // Default header configuration
    document.addEventListener(&#39;DOMContentLoaded&#39;, function() {
        configureHeader();
    });

})();

(function() {
    // Navigation function for page transitions
    window.navigateTo = function(targetPageId) {
        // Trigger navigation to another page using the provided snippet
        const isInIframe = window.self !== window.top;
        const targetFileName = `${targetPageId}.html`;
        if (isInIframe) {
            window.parent.postMessage({
                type: &#39;iframeNavigation&#39;,
                targetPageId: targetPageId
            }, &#39;*&#39;);
        } else {
            window.location.href = targetFileName;
        }
    };

    // Utility function to handle back navigation
    window.handleBackNavigation = function() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            navigateTo(&#39;home_page&#39;);
        }
    };

    // Function to show toast notifications
    window.showToast = function(message, type = &#39;info&#39;) {
        const toast = document.createElement(&#39;div&#39;);
        toast.className = `toast toast-bottom toast-center z-50`;
        toast.innerHTML = `<div class="alert alert-${type}"><span>${message}</span></div>`;
        document.body.appendChild(toast);
        
        // Auto remove after 3 seconds
        setTimeout(() => {
            if (toast.parentNode) {
                toast.parentNode.removeChild(toast);
            }
        }, 3000);
    };

    // Smooth scroll to top function
    window.scrollToTop = function() {
        window.scrollTo({
            top: 0,
            behavior: &#39;smooth&#39;

                item.classList.add(&#39;dock-item-active&#39;);
            } else {

    window.APP_GLOBALS = window.APP_GLOBALS || {};

    window.addToCart = function(product) {
        const existingItem = window.APP_GLOBALS.cart.find(item => item.id === product.id);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            window.APP_GLOBALS.cart.push({...product, quantity: 1});
        }
        showToast(&#39;商品已添加到购物车&#39;, &#39;success&#39;);
        updateCartBadge();
    };

    window.removeFromCart = function(productId) {
        window.APP_GLOBALS.cart = window.APP_GLOBALS.cart.filter(item => item.id !== productId);
        updateCartBadge();
    };

    window.updateCartQuantity = function(productId, quantity) {
        const item = window.APP_GLOBALS.cart.find(item => item.id === productId);
        if (item) {
            if (quantity <= 0) {
                removeFromCart(productId);
            } else {
                item.quantity = quantity;
            }
        }
        updateCartBadge();
    };

    window.getCartTotal = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + (item.price * item.quantity), 0);
    };

    window.getCartItemCount = function() {
        return window.APP_GLOBALS.cart.reduce((total, item) => total + item.quantity, 0);
    };

    function updateCartBadge() {
        const cartBadge = document.querySelector(&#39;[data-section-id="common_bottom_dock"] .cart-badge&#39;);
        const count = getCartItemCount();
        if (cartBadge) {
            if (count > 0) {
                cartBadge.textContent = count > 99 ? &#39;99+&#39; : count;
                cartBadge.classList.remove(&#39;hidden&#39;);
            } else {
                cartBadge.classList.add(&#39;hidden&#39;);
            }
        }
    }

    // User session management
    window.APP_GLOBALS.user = window.APP_GLOBALS.user || null;
    window.APP_GLOBALS.isAdmin = window.APP_GLOBALS.isAdmin || false;

    window.setUser = function(user, isAdmin = false) {
        window.APP_GLOBALS.user = user;
        window.APP_GLOBALS.isAdmin = isAdmin;
    };

    window.logout = function() {
        window.APP_GLOBALS.user = null;
        window.APP_GLOBALS.isAdmin = false;
        window.APP_GLOBALS.cart = [];
        navigateTo(&#39;login_selection_page&#39;);
    };

    // Form validation utilities
    window.validateEmail = function(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    };

    window.validatePhone = function(phone) {
        const re = /^1[3-9]\d{9}$/;
        return re.test(phone);
    };

    window.validatePassword = function(password) {
        return password.length >= 6;
    };

})();
</script><script>
document.addEventListener(&#39;DOMContentLoaded&#39;, function() {
    if (window.configureHeader) {
        window.configureHeader({
            title: &#39;用户管理&#39;,
            showBackButton: true
        });
    }

    // "默认软件出厂是没有用户", 此处模拟用户数据在后续被加载
    setTimeout(() => {
        addInitialUsers();
        updateUserStats();
        renderUserList();
    }, 100);

    const searchInput = document.getElementById(&#39;searchInput&#39;);
    const clearSearchBtn = document.getElementById(&#39;clearSearchBtn&#39;);

    searchInput.addEventListener(&#39;input&#39;, function(e) {
        const term = e.target.value.trim();
        clearSearchBtn.classList.toggle(&#39;hidden&#39;, term.length === 0);
        
        clearTimeout(window.searchTimeout);
        window.searchTimeout = setTimeout(() => {
            handleSearch();
        }, 300);
    });
    
    searchInput.addEventListener(&#39;keypress&#39;, function(e) {
        if (e.key === &#39;Enter&#39;) {
            handleSearch();
        }
    });
});

const USER_DATA = {
    users: [], // 默认没有用户
    currentFilter: &#39;all&#39;,
    searchTerm: &#39;&#39;
};

function addInitialUsers() {
    // 增加一个用户NanoShell并标出管理员
    // 根据登录页变量A增加其他用户 - 这里模拟增加3个用户
    USER_DATA.users = [
        { 
            id: &#39;000001&#39;, 
            name: &#39;NanoShell&#39;, 
            status: &#39;active&#39;, 
            registerDate: &#39;2020-01-01&#39;, 
            avatar: &#39;https://placehold.co/48x48.png?text=NS&#39;,
            banHistory: [],
            isAdmin: true
        },
        { 
            id: &#39;100003&#39;, 
            name: &#39;TroubleMaker&#39;, 
            status: &#39;banned&#39;, 
            registerDate: &#39;2024-03-10&#39;,
            avatar: &#39;https://placehold.co/48x48.png?text=TM&#39;,
            banHistory: [
                { reason: &#39;发布不当内容&#39;, duration: &#39;30天&#39;, date: &#39;2025-09-18&#39;, active: true, endDate: &#39;2025-10-18&#39; }
            ],
            isAdmin: false
        },
        { 
            id: &#39;100004&#39;, 
            name: &#39;ActiveUser&#39;, 
            status: &#39;active&#39;, 
            registerDate: &#39;2024-04-05&#39;,
            avatar: &#39;https://placehold.co/48x48.png?text=AU&#39;,
            banHistory: [],
            isAdmin: false
        },
        { 
            id: &#39;100005&#39;, 
            name: &#39;RegularUser&#39;, 
            status: &#39;active&#39;, 
            registerDate: &#39;2024-05-12&#39;,
            avatar: &#39;https://placehold.co/48x48.png?text=RU&#39;,
            banHistory: [],
            isAdmin: false
        }
    ];
}

function updateUserStats() {
    const totalUsers = USER_DATA.users.length;
    const bannedUsers = USER_DATA.users.filter(user => user.status === &#39;banned&#39;).length;
    const activeUsers = totalUsers - bannedUsers;
    
    document.getElementById(&#39;totalUsersCount&#39;).textContent = totalUsers;
    document.getElementById(&#39;bannedUsersCount&#39;).textContent = bannedUsers;
    document.getElementById(&#39;activeUsersCount&#39;).textContent = activeUsers;
}

function getFilteredUsers() {
    const searchTerm = document.getElementById(&#39;searchInput&#39;).value.toLowerCase();
    let filtered = [...USER_DATA.users];
    
    if (searchTerm) {
        filtered = filtered.filter(user => 
            user.id.toLowerCase().includes(searchTerm) ||
            user.name.toLowerCase().includes(searchTerm)
        );
    }
    
    switch (USER_DATA.currentFilter) {
        case &#39;banned&#39;:
            filtered = filtered.filter(user => user.status === &#39;banned&#39;);
            break;
        case &#39;active&#39;:
            filtered = filtered.filter(user => user.status === &#39;active&#39;);
            break;
        case &#39;date&#39;:
            filtered.sort((a, b) => new Date(b.registerDate) - new Date(a.registerDate));
            break;
    }
    
    filtered.sort((a, b) => (b.isAdmin ? 1 : 0) - (a.isAdmin ? 1 : 0));
    return filtered;
}

function renderUserList() {
    const container = document.getElementById(&#39;UserAccountList&#39;);
    const users = getFilteredUsers();
    
    if (users.length === 0) {
        container.innerHTML = `
            <div class="text-center py-12 card-surface rounded-box">
                <span class="iconify text-base-content/30" data-icon="heroicons:users" data-width="48"></span>
                <p class="text-base-content/60 mt-4 spacious-text">${document.getElementById(&#39;searchInput&#39;).value ? &#39;未找到匹配的用户&#39; : &#39;当前没有注册用户&#39;}</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = users.map(user => createUserCard(user)).join(&#39;&#39;);
}

function createUserCard(user) {
    const statusBadge = user.status === &#39;active&#39; 
        ? &#39;<div class="badge badge-success badge-sm status-badge">正常</div>&#39;
        : &#39;<div class="badge badge-error badge-sm status-badge">已封禁</div>&#39;;

    const adminBadge = user.isAdmin ? &#39;<div class="badge badge-outline admin-badge badge-sm">管理员</div>&#39; : &#39;&#39;;

    const currentBanInfo = user.status === &#39;banned&#39; ? user.banHistory.find(ban => ban.active) : null;
    const banInfoDisplay = currentBanInfo 
        ? `<div class="text-xs text-error mt-1 spacious-text ban-info-display">
             原因: ${currentBanInfo.reason} | 至: ${currentBanInfo.endDate || &#39;永久&#39;}
           </div>` : &#39;&#39;;

    const banHistoryContent = user.banHistory.length > 0 
        ? user.banHistory.map(ban => `
            <div class="ban-history-item ${ban.active ? &#39;active&#39; : &#39;&#39;} mb-3">
              <div class="flex justify-between items-start">
                <div>
                  <p class="font-medium text-base-content/90 spacious-text">理由: ${ban.reason}</p>
                  <p class="text-xs text-base-content/70 spacious-text">时长: ${ban.duration}</p>
                </div>
                <div class="text-right flex-shrink-0 ml-4">
                  <p class="text-xs text-base-content/70 spacious-text">${ban.date}</p>
                  ${ban.active &amp;&amp; ban.endDate ? `<p class="text-xs text-error spacious-text">至: ${ban.endDate}</p>` : &#39;&#39;}
                </div>
              </div>
            </div>`).join(&#39;&#39;)
        : &#39;<p class="text-base-content/70 spacious-text text-center py-2">暂无封禁历史</p>&#39;;

    return `
        <div data-repeatable="true" data-type="container" class="collapse collapse-arrow user-card card-surface rounded-box">
          <input type="checkbox" class="peer" />
          <div class="collapse-title p-4 flex items-center justify-between min-h-0">
            <div class="flex items-center gap-3 overflow-hidden flex-1">
              <div class="avatar flex-shrink-0">
                <div class="w-12 h-12 user-avatar">
                    <img src="${user.avatar}" alt="${user.name} avatar" data-type="image" />
                </div>
              </div>
              <div class="overflow-hidden flex-1">
                <div class="flex items-center gap-2">
                  <p data-type="text" class="font-semibold text-base-content truncate spacious-text">${user.name}</p>
                  ${user.isAdmin ? adminBadge : statusBadge}
                </div>
                <p data-type="text" class="text-xs text-base-content/60 mt-1 spacious-text">ID: ${user.id}</p>
                ${banInfoDisplay}
              </div>
            </div>
          </div>
          <div class="collapse-content px-4">
            <div class="border-t border-base-300/50 pt-3">
              <h4 data-type="text" class="font-medium text-sm text-base-content mb-3 spacious-text">用户操作</h4>
              <div class="flex flex-wrap gap-2 mb-4">
                ${user.isAdmin 
                    ? &#39;<p class="text-base-content/60 text-sm spacious-text p-2">管理员账号无法封禁</p>&#39;
                    : (user.status === &#39;active&#39;
                        ? `<button class="btn btn-sm btn-error touch-target" onclick="showBanModal(&#39;${user.id}&#39;)"><span class="iconify" data-icon="heroicons:no-symbol" data-width="16"></span>封禁用户</button>`
                        : `<button class="btn btn-sm btn-success touch-target" onclick="handleUnban(event, &#39;${user.id}&#39;)"><span class="iconify" data-icon="heroicons:check-circle" data-width="16"></span>解除封禁</button>`)
                }
                <button class="btn btn-sm btn-ghost" onclick="showToast(&#39;查看详情功能开发中&#39;)"><span class="iconify" data-icon="heroicons:information-circle" data-width="16"></span>详情</button>
                <button class="btn btn-sm btn-ghost" onclick="showToast(&#39;发送通知功能开发中&#39;)"><span class="iconify" data-icon="heroicons:paper-airplane" data-width="16"></span>通知</button>
              </div>
              <h4 data-type="text" class="font-medium text-sm text-base-content mb-3 spacious-text">封禁历史</h4>
              <div class="text-xs text-base-content/80 space-y-3">${banHistoryContent}</div>
            </div>
          </div>
        </div>`;
}

function handleSearch() {
    renderUserList();
}

function clearSearch() {
    const searchInput = document.getElementById(&#39;searchInput&#39;);
    searchInput.value = &#39;&#39;;
    searchInput.dispatchEvent(new Event(&#39;input&#39;));
    searchInput.focus();
}

function handleFilter(filterType) {
    USER_DATA.currentFilter = filterType;
    renderUserList();
    const activeElement = document.activeElement;
    if (activeElement &amp;&amp; activeElement.closest(&#39;.dropdown&#39;)) {
        activeElement.closest(&#39;.dropdown&#39;).querySelector(&#39;button&#39;).focus();
    }
}

function showBanModal(userId) {
    const user = USER_DATA.users.find(u => u.id === userId);
    if (!user) return;
    
    document.getElementById(&#39;banModalTitle&#39;).textContent = `封禁用户: ${user.name}`;
    document.getElementById(&#39;confirmBanBtn&#39;).dataset.userid = userId;
    document.getElementById(&#39;banReason&#39;).value = &#39;&#39;;
    document.getElementById(&#39;banDuration&#39;).selectedIndex = 0;
    
    banUserModal.showModal();
}

function confirmBan() {
    const userId = document.getElementById(&#39;confirmBanBtn&#39;).dataset.userid;
    const reason = document.getElementById(&#39;banReason&#39;).value.trim();
    const duration = document.getElementById(&#39;banDuration&#39;).value;
    
    if (!reason) {
        showToast(&#39;请填写封禁原因&#39;, &#39;warning&#39;);
        return;
    }
    
    handleBan(userId, duration, reason);
    banUserModal.close();
}

function handleBan(userId, duration, reason) {
    const user = USER_DATA.users.find(u => u.id === userId);
    if (user) {
        user.status = &#39;banned&#39;;
        user.banHistory.forEach(b => b.active = false);
        const currentDate = new Date();
        const endDate = duration === &#39;永久&#39; ? null : new Date(currentDate.getTime() + getDurationInMs(duration));
        
        user.banHistory.unshift({ 
            reason: reason, 
            duration, 
            date: currentDate.toISOString().split(&#39;T&#39;)[0], 
            active: true, 
            endDate: endDate ? endDate.toISOString().split(&#39;T&#39;)[0] : null 
        });
        
        updateUserStats();
        renderUserList();
        showToast(`用户 ${user.name} 已被封禁`, &#39;success&#39;);
    }
}

function handleUnban(event, userId) {
    event.stopPropagation();
    const user = USER_DATA.users.find(u => u.id === userId);
    if (user) {
        user.status = &#39;active&#39;;
        user.banHistory.forEach(ban => ban.active = false);
        updateUserStats();
        renderUserList();
        showToast(`用户 ${user.name} 已解封`, &#39;info&#39;);
    }
}

function getDurationInMs(duration) {
    if (duration.includes(&#39;天&#39;)) {
        return parseInt(duration) * 24 * 60 * 60 * 1000;
    }
    return 0; // for &#39;永久&#39;
}

</script>
